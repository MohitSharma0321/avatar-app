name: Build Avatar App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --project-name avatar_app build_app

      - name: Copy app code
        run: |
          cp -r app/lib/* build_app/lib/

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Build AAB
        working-directory: build_app
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: avatar-app-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: avatar-app-aab
          path: build_app/build/app/outputs/bundle/release/app-release.aab
